name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.module }}
    # go-modules is public (avoids auth friction for private Go module
    # checkouts elsewhere), and no self-hosted runner group allows public
    # repos, so a job here never gets dispatched. ubuntu-latest has no such
    # restriction, and is free for public repos.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: obs
    steps:
      - name: Setup
        uses: SierranaTech/actions/setup@main
        with:
          go: true
          go-mod-directory: ${{ matrix.module }}
      - name: Go suite
        uses: SierranaTech/actions/go-suite@main
        with:
          working-directory: ${{ matrix.module }}
          badge-prefix: ${{ matrix.module }}
          run-report: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
